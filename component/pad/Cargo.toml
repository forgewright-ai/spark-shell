[package]
name = "spark-pad"
version = "0.141.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/forgewright-ai/spark-shell"
publish = false
description = "The minimized windows of the desktop, on a surface of their own"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spark-pad"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system"] }
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
libloading = "0.9"
calloop = { version = "0.14", features = ["signals"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
