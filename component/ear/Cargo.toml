[package]
name = "spark-ear"
version = "0.144.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/forgewright-ai/spark-shell"
publish = false
description = "The ear: the microphone's sound to the words spoken, as they are spoken"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spark-ear"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
