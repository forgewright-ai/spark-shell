[package]
name = "spark-dialog"
version = "0.152.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/forgewright-ai/spark-shell"
publish = false
description = "The dialog: an MCP host that draws home, in a window of its own or in a terminal"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spark-dialog"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
png = "0.18"
unicode-width = "0.2"
libc = "0.2"
gif = { version = "0.14.2", default-features = false, features = ["std"] }

# the window of the dialog's own, as spark-bar and spark-winpad have theirs: Wayland's client library, cairo, pango
# and the keyboard's layouts opened at run time, so the binary needs no -devel package and runs on each family's own
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system"] }
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
libloading = "0.9"
calloop = { version = "0.14" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
