# cargo-deny over the dialog's crates: advisories, licences, and a ban
# list of every crate that speaks to a network -- the dialog's own network
# use is std's probe of spark's port on this machine, and a crate that
# could add more is refused, by name. Its semantic search speaks to a
# Unix socket of the session with std alone (src/semantic.rs).
[graph]
targets = ["x86_64-unknown-linux-musl"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "allow"
deny = [
    { name = "reqwest" }, { name = "hyper" }, { name = "h2" }, { name = "ureq" }, { name = "curl" },
    { name = "isahc" }, { name = "attohttpc" }, { name = "tungstenite" }, { name = "tokio" },
    { name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }, { name = "rustls" }, { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
