# The native components that share spark-theme build from one locked dependency graph.
[workspace]
members = ["bar", "dialog", "theme", "winpad"]
exclude = ["ear", "wallpaper"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
