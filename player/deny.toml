# cargo-deny over the player's crates: advisories, licences, and the
# dialog's ban list of every crate that speaks to a network -- the player
# plays a file from the cache, nothing it runs leaves the machine.
# ISC is libloading's licence (it opens libmpv and libEGL at run time).
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "ISC"]

[bans]
multiple-versions = "allow"
deny = [
    { name = "reqwest" }, { name = "hyper" }, { name = "h2" }, { name = "ureq" }, { name = "curl" },
    { name = "isahc" }, { name = "attohttpc" }, { name = "tungstenite" }, { name = "tokio" },
    { name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }, { name = "rustls" }, { name = "ring" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
