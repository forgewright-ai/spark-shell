[package]
name = "spark-dialog"
version = "0.107.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false
description = "The spark dialog: an MCP host that draws one 60 by 40 window"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spark-dialog"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
png = "0.18"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
