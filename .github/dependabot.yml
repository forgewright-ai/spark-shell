# Dependabot keeps every action's sha pin and the crates of the dialog, the pad and the wallpaper current, weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL's init and analyze must move together: one pull request
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: cargo
    directory: /component/dialog
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /component/winpad
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /component/wallpaper
    schedule:
      interval: weekly
