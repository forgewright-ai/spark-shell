# Dependabot keeps every action's sha pin and the dialog's and the player's crates current, weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL's init and analyze must move together: one pull request
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: cargo
    directory: /dialog
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /player
    schedule:
      interval: weekly
