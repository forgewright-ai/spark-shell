# Dependabot keeps every action's sha pin and the crates of the dialog, the pad, the bar, the ear and the wallpaper current, weekly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL's init and analyze must move together: one pull request
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
  # one pull request for a crate, across the components that use it: the
  # five share most of their crates, and a crate with a pull request for
  # each component took five rounds of pins and runs
  - package-ecosystem: cargo
    directories:
      - /component/dialog
      - /component/winpad
      - /component/bar
      - /component/ear
      - /component/wallpaper
    schedule:
      interval: weekly
    groups:
      components:
        group-by: dependency-name
