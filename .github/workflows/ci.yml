  green:
    # the one name a ruleset on main can require: it needs every job above
    # and fails when any of them failed, was cancelled or was skipped. A
    # pull request from this repository's own branch is the one run whose
    # jobs are all skipped on purpose, and green skips with them.
    needs: [lint, linux, debian, ubuntu, arch, void, fedora, opensuse, desktop, macos, dialog, wallpaper, wallpaper-deny, winpad, winpad-deny, ear, ear-deny]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case " $RESULTS " in
              *" failure "*|*" cancelled "*|*" skipped "*) echo "ci: a job did not pass: $RESULTS"; exit 1 ;;
          esac
          echo "ci: green ($RESULTS)"
