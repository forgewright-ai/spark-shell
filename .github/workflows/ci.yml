# spark-shell CI: the render, link and hand-back machinery in a throwaway
# HOME and a throwaway root -- on Ubuntu, Debian, Arch, Void, Fedora,
# openSUSE and macOS. Plus the privacy patterns, ASCII docs, shellcheck,
# the package names of distro/*.env looked up on their own family (nothing
# installed), and the desktop job: the desktop's packages installed for
# real in each family's container, spark-shell on as a plain user, the
# rendered config read by sway, a headless sway with a foot in it.
name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the suite passed 1000 tests in v0.86, and the arch container ran out at 979 of them in 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: privacy gate over the whole tree
        # the personal word list is a repository secret (one word per line);
        # each word escaped for grep -E, and -l everywhere: a hit names the
        # file, never the line -- this log is public. A fork without the
        # secret gets a NOTICE and the generic patterns only. Each check is
        # an if/exit 1: a negated pipeline (`! git grep ...`) is exempt from
        # errexit, so only the last one would decide the step. A systemd
        # unit name (getty@tty1.service) is not an address.
        env:
          SPARK_PRIVACY_TERMS_SECRET: ${{ secrets.SPARK_PRIVACY_TERMS }}
        run: |
          printf '%s\n' "$SPARK_PRIVACY_TERMS_SECRET" > "$RUNNER_TEMP/privacy-terms"
          terms=$(cat .privacy-terms "$RUNNER_TEMP/privacy-terms" | grep -v '^#' | grep -v '^[[:space:]]*$' | sort -u | sed 's,[][\.*^$+?(){}|/],\\&,g' | paste -sd'|' -)
          if [ -z "$terms" ]; then echo "NOTICE: no privacy word list -- generic patterns only"; else
            if git grep -l -i -w -E "$terms" -- . ':(exclude).privacy-terms'; then
              echo "privacy: a listed word is in the tree"; exit 1; fi; fi
          hits=$(git grep -n -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . | sed -E 's/[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.(service|socket|timer|target)//g' | grep -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' | grep -v 'you@example.com' | cut -d: -f1 | sort -u || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"; echo "privacy: an e-mail address is in the tree"; exit 1; fi
          if git grep -l -E '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)\b' -- .; then
            echo "privacy: a private IPv4 is in the tree"; exit 1; fi
          if git grep -l -E '(^.|[^[:alnum:]/._-])/(home|Users)/[A-Za-z0-9_-]+' -- .; then
            echo "privacy: a home path naming a user is in the tree"; exit 1; fi
      - name: ascii docs
        run: |
          tab=$(printf '\t')
          for f in README.md CHANGELOG.md CREDITS.md LICENSE config.example allowed-signers spark-shell tests/shell_test.sh tests/dialog_build.sh tests/dialog_sbom.sh tests/desktop_proof.sh tests/dialog_pty.py lib/terminal_profile.py tests/profile_test.py lib/saver.py tests/saver_test.py $(find templates distro themes dialog/src dialog/tests -type f ! -name '*.txt' | sort) dialog/Cargo.toml dialog/deny.toml dialog/dialog.env dialog/rust-toolchain.toml; do
            if LC_ALL=C grep -n "[^ -~${tab}]" "$f"; then
              echo "non-ASCII in $f"; exit 1; fi; done
      - name: no hex color in a template (the look is the 16 slots)
        run: |
          if grep -rnE '#[0-9a-fA-F]{6}' templates; then
            echo "a hex color is in a template"; exit 1; fi
      - name: shellcheck
        run: shellcheck -S warning spark-shell tests/shell_test.sh tests/dialog_build.sh tests/dialog_sbom.sh tests/desktop_proof.sh
      - name: every package name of distro/debian.env exists on Ubuntu, which says ID_LIKE=debian (nothing installed)
        run: sudo apt-get update -qq >/dev/null && apt-cache show $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p; s/^PKG_LOGIN=//p' distro/debian.env) >/dev/null
      - name: the suite in a throwaway HOME
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
      - name: the idle screen's savers
        run: |
          python3 -I tests/saver_test.py
          python3 -I tests/battery_test.py
          python3 -I tests/cleanup_test.py
          python3 -I tests/printers_test.py
          python3 -I tests/open_path_test.py
          python3 -I tests/network_test.py
          python3 -I tests/display_test.py
          python3 -I tests/layout_terminal_test.py
  debian:
    # the same suite on Debian itself, where distro/debian.env's names are
    # looked up. The privacy and ascii gates ran once, on linux.
    runs-on: ubuntu-latest
    container: debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c   # a stable release: pinned, bump the digest with a point release
    timeout-minutes: 15   # the suite passed 1000 tests in v0.86, and the arch container ran out at 979 of them in 10
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 git shellcheck diffutils jq openssh-client curl >/dev/null   # jq: a desk reads the model's answer with it; ssh-keygen: a release tag's signature
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: every package name of distro/debian.env exists on Debian (nothing installed)
        run: apt-cache show $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p; s/^PKG_LOGIN=//p' distro/debian.env) >/dev/null
      - name: shellcheck
        run: shellcheck -S warning spark-shell tests/shell_test.sh
      - name: the suite in a throwaway HOME
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
  arch:
    # the same suite where the tools come from pacman
    runs-on: ubuntu-latest
    container: archlinux:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Arch there is, and -Syu moves it to today anyway
    timeout-minutes: 15   # the suite passed 1000 tests in v0.86, and the arch container ran out at 979 of them in 10
    steps:
      - run: pacman -Syu --noconfirm --needed python git diffutils jq openssh >/dev/null   # ssh-keygen: a release tag's signature
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: every package name of distro/arch.env exists on Arch (nothing installed)
        run: pacman -Sp --needed $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p; s/^PKG_LOGIN=//p' distro/arch.env) >/dev/null
      - name: the suite in a throwaway HOME
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
  void:
    # the third family: xbps (glibc), the desktop's names too. xbps itself
    # first: a rolling distro refuses every install while xbps is behind.
    # libstdc++ is the runner's node (checkout)
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Void there is, and -Su moves it to today anyway
    timeout-minutes: 15   # the suite passed 1000 tests in v0.86, and the arch container ran out at 979 of them in 10
    steps:
      - run: xbps-install -Syu xbps >/dev/null 2>&1 || true; xbps-install -Syu >/dev/null; xbps-install -Sy python3 git bash diffutils jq gawk gzip libstdc++ openssh curl >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: every package name of distro/void.env exists on Void (nothing installed)
        run: for p in $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p; s/^PKG_LOGIN=//p' distro/void.env); do xbps-query -R "$p" >/dev/null || { echo "no package $p"; exit 1; }; done
      - name: the suite in a throwaway HOME
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
  fedora:
    # the fourth family: dnf over rpm, the names of distro/fedora.env looked
    # up with repoquery (a provider counts, as rpm -q --whatprovides does)
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80   # a versioned release: pinned, bump the digest with the next Fedora
    timeout-minutes: 15
    steps:
      - run: dnf install -y -q python3 git ShellCheck diffutils jq openssh-clients curl >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: every package name of distro/fedora.env exists on Fedora (nothing installed)
        run: for p in $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p; s/^PKG_LOGIN=//p' distro/fedora.env); do dnf -q repoquery --whatprovides "$p" 2>/dev/null | grep -q . || { echo "no package $p"; exit 1; }; done
      - name: shellcheck
        run: shellcheck -S warning spark-shell tests/shell_test.sh
      - name: the suite in a throwaway HOME
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
  opensuse:
    # the fifth family: zypper over rpm, the names of distro/opensuse.env
    # looked up on Tumbleweed itself. libstdc++6 is the runner's node
    # (checkout); findutils: the image has no find, and the files provider
    # and the reminders' prune are find
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Tumbleweed there is, and zypper dup moves it to today anyway
    timeout-minutes: 15
    steps:
      - run: zypper --non-interactive --quiet install python3 git ShellCheck diffutils findutils jq openssh-clients curl gawk tar gzip libstdc++6 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: every package name of distro/opensuse.env exists on Tumbleweed (nothing installed)
        run: for p in $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p; s/^PKG_LOGIN=//p' distro/opensuse.env); do zypper --non-interactive --no-refresh search --match-exact --provides "$p" >/dev/null 2>&1 || { echo "no package $p"; exit 1; }; done
      - name: shellcheck
        run: shellcheck -S warning spark-shell tests/shell_test.sh
      - name: the suite in a throwaway HOME
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
  desktop:
    # the desktop for real, per family: its packages installed in the
    # family's container, spark-shell on as a plain user (the renders, the
    # palette, a drawing drawn again in it through rsvg-convert), the sway
    # config read by sway -C, then a headless sway with a foot in it, asked
    # through swaymsg, on a session bus of its own; mako's notifications
    # drawn in it in two palettes, the pictures kept for a look. No seat,
    # no GPU, no sound card: a proof of the install and the render, said
    # so; a screen is a machine's proof.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            distro: debian
            image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
            prep: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq diffutils >/dev/null
            install: DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
            proof: dbus
          - family: ubuntu   # the Debian family's file: Ubuntu says ID_LIKE=debian
            distro: debian
            image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
            prep: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq diffutils >/dev/null
            install: DEBIAN_FRONTEND=noninteractive apt-get install -y -qq
            proof: dbus systemd   # mako 1.8's makoctl asks the bus through systemd's busctl, which a real Ubuntu always has
          - family: arch
            distro: arch
            image: archlinux:latest   # zizmor: ignore[unpinned-images] a rolling distro
            prep: pacman -Syu --noconfirm --needed git jq diffutils >/dev/null
            install: pacman -S --needed --noconfirm
            proof: dbus
          - family: void
            distro: void
            image: ghcr.io/void-linux/void-glibc-full:latest   # zizmor: ignore[unpinned-images] a rolling distro
            prep: xbps-install -Syu xbps >/dev/null 2>&1 || true; xbps-install -Syu >/dev/null; xbps-install -Sy git bash jq gawk gzip libstdc++ shadow >/dev/null
            install: xbps-install -Sy
            proof: dbus
          - family: fedora
            distro: fedora
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
            prep: dnf install -y -q git jq diffutils shadow-utils util-linux >/dev/null
            install: dnf install -y -q
            proof: dbus-daemon
          - family: opensuse
            distro: opensuse
            image: opensuse/tumbleweed:latest   # zizmor: ignore[unpinned-images] a rolling distro
            # a rolling distro: the image is one snapshot, the repository another, and foot's terminfo refused to meet the image's terminfo-base until zypper dup put the two on one snapshot (what spark's distro file says of Tumbleweed)
            prep: zypper --non-interactive refresh >/dev/null; zypper --non-interactive dup >/dev/null; zypper --non-interactive install git jq diffutils findutils gawk tar gzip libstdc++6 shadow
            install: zypper --non-interactive --quiet install
            proof: dbus-1-daemon dbus-1-tools
    container: ${{ matrix.image }}   # zizmor: ignore[unpinned-images] the matrix above pins each versioned image by digest; the rolling ones are latest by nature
    env:
      FAMILY: ${{ matrix.family }}
      DISTRO: ${{ matrix.distro }}
      PREP: ${{ matrix.prep }}
      INSTALL: ${{ matrix.install }}
      PROOF: ${{ matrix.proof }}
    steps:
      - run: sh -c "$PREP"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the family's packages, every list but the login screen's (quiet; a refusal is shown by a second try)
        run: |
          pkgs=$(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p; s/^PKG_SOUND=//p' "distro/$DISTRO.env" | tr '\n' ' ')
          sh -c "$INSTALL $pkgs >/dev/null" || sh -c "$INSTALL $pkgs"
      - name: the proof's own (a session bus for the headless sway, which a machine's login makes)
        run: sh -c "$INSTALL $PROOF >/dev/null" || sh -c "$INSTALL $PROOF"
      - name: spark-shell on as a plain user, the config read by sway, a headless sway with a foot in it
        # sway's package on Arch, Void and Fedora sets cap_sys_nice on the
        # binary; a container's bounding set lacks it, so a plain user's
        # execve of that file says EPERM. A copy carries no capability.
        run: |
          set -eu
          useradd -m -s /bin/bash ada
          chmod -R a+rX "$GITHUB_WORKSPACE"
          mkdir -p /opt/nocap && cp "$(command -v sway)" /opt/nocap/sway && chmod 755 /opt/nocap/sway
          cp tests/desktop_proof.sh /tmp/desktop_proof.sh
          chmod 755 /tmp/desktop_proof.sh
          su ada -c "REPO='$GITHUB_WORKSPACE' SWAY_NOCAP=/opt/nocap sh /tmp/desktop_proof.sh"
      - name: the notifications as drawn, kept for a look
        if: always()
        run: mkdir -p proof && cp -R ~ada/proof/. proof/ 2>/dev/null || true   # ~ada: the proof user's home, by its name
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: notifications-${{ matrix.family }}
          path: proof
          retention-days: 14
          if-no-files-found: ignore
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the suite in a throwaway HOME (Apple's sh)
        run: |
          sh tests/shell_test.sh
          python3 tests/bt_agent_test.py
      - name: the Terminal.app helper, built and never applied
        run: SPARK_SHELL_NO_APPLY=1 /usr/bin/python3 tests/profile_test.py
  dialog:
    # the dialog (dialog/): the format, clippy, its tests (the golden
    # renders in two palettes, the host against stub providers), the
    # release build twice and its sha256 against dialog/dialog.env (the
    # build is reproducible, so the tree pins the binary), the binary at a
    # pty against spark-shell's own providers with no network, cargo-deny,
    # and the binary kept as an artifact for a proof on a machine.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the toolchain dialog/rust-toolchain.toml pins
        working-directory: dialog
        run: rustup show active-toolchain || rustup toolchain install
      - name: the format and clippy
        working-directory: dialog
        run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
      - name: the tests
        working-directory: dialog
        run: cargo test --locked
      - name: the release build, twice, the same bytes
        run: |
          set -eu
          one=$(sh tests/dialog_build.sh | cut -d' ' -f1)
          (cd dialog && cargo clean --release --target x86_64-unknown-linux-musl)
          two=$(sh tests/dialog_build.sh | cut -d' ' -f1)
          echo "built $one, from clean again $two"
          if [ "$one" != "$two" ]; then echo "two builds of one tree differ: the build is not reproducible"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: spark-dialog-x86_64-linux-musl
          path: dialog/target/x86_64-unknown-linux-musl/release/spark-dialog
          retention-days: 14
      - name: the sha256 dialog/dialog.env pins
        run: |
          set -eu
          got=$(sha256sum dialog/target/x86_64-unknown-linux-musl/release/spark-dialog | cut -d' ' -f1)
          want=$(sed -n 's/^DIALOG_SHA256_X86_64_LINUX_MUSL=//p' dialog/dialog.env)
          if [ "$got" != "$want" ]; then echo "the build is not the binary dialog/dialog.env pins -- DIALOG_SHA256_X86_64_LINUX_MUSL=$got"; exit 1; fi
      - name: the binary at a pty against spark-shell's providers, with no network
        run: sudo unshare -n sudo -u "$(id -un)" env PATH="$PATH" python3 tests/dialog_pty.py dialog/target/x86_64-unknown-linux-musl/release/spark-dialog
      - name: cargo-deny (advisories, licences, no network crate)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25   # v2.1.1
        with:
          manifest-path: dialog/Cargo.toml
  workflows:
    # the workflows are code too: zizmor (pinned, in a venv of its own)
    # reads every file under .github/workflows; medium and above fail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor over .github/workflows
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet zizmor==1.30.1
          "$RUNNER_TEMP/zizmor/bin/zizmor" --min-severity medium .github/workflows
