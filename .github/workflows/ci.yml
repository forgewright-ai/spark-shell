# spark-shell CI: the render, link and hand-back machinery in a throwaway
# HOME and a throwaway root -- on Ubuntu, Debian, Arch, Void and macOS. Plus the
# privacy patterns, ASCII docs, shellcheck, and the package names of
# distro/*.env looked up on their own family (nothing installed).
name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: privacy gate over the whole tree
        # the personal word list is a repository secret (one word per line);
        # each word escaped for grep -E, and -l everywhere: a hit names the
        # file, never the line -- this log is public. A fork without the
        # secret gets a NOTICE and the generic patterns only. Each check is
        # an if/exit 1: a negated pipeline (`! git grep ...`) is exempt from
        # errexit, so only the last one would decide the step. A systemd
        # unit name (getty@tty1.service) is not an address.
        env:
          SPARK_PRIVACY_TERMS_SECRET: ${{ secrets.SPARK_PRIVACY_TERMS }}
        run: |
          printf '%s\n' "$SPARK_PRIVACY_TERMS_SECRET" > "$RUNNER_TEMP/privacy-terms"
          terms=$(cat .privacy-terms "$RUNNER_TEMP/privacy-terms" | grep -v '^#' | grep -v '^[[:space:]]*$' | sort -u | sed 's,[][\.*^$+?(){}|/],\\&,g' | paste -sd'|' -)
          if [ -z "$terms" ]; then echo "NOTICE: no privacy word list -- generic patterns only"; else
            if git grep -l -i -w -E "$terms" -- . ':(exclude).privacy-terms'; then
              echo "privacy: a listed word is in the tree"; exit 1; fi; fi
          hits=$(git grep -n -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' -- . | sed -E 's/[A-Za-z0-9._-]+@[A-Za-z0-9.-]+\.(service|socket|timer|target)//g' | grep -E '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' | grep -v 'you@example.com' | cut -d: -f1 | sort -u || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"; echo "privacy: an e-mail address is in the tree"; exit 1; fi
          if git grep -l -E '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+)\b' -- .; then
            echo "privacy: a private IPv4 is in the tree"; exit 1; fi
          if git grep -l -E '(^.|[^[:alnum:]/._-])/(home|Users)/[A-Za-z0-9_-]+' -- .; then
            echo "privacy: a home path naming a user is in the tree"; exit 1; fi
      - name: ascii docs
        run: |
          tab=$(printf '\t')
          for f in README.md CHANGELOG.md CREDITS.md LICENSE config.example spark-shell tests/shell_test.sh lib/terminal_profile.py tests/profile_test.py $(find templates distro themes -type f | sort); do
            if LC_ALL=C grep -n "[^ -~${tab}]" "$f"; then
              echo "non-ASCII in $f"; exit 1; fi; done
      - name: no hex colour in a template (the look is the 16 slots)
        run: |
          if grep -rnE '#[0-9a-fA-F]{6}' templates; then
            echo "a hex colour is in a template"; exit 1; fi
      - name: shellcheck
        run: shellcheck -S warning spark-shell tests/shell_test.sh
      - name: the suite in a throwaway HOME
        run: sh tests/shell_test.sh
  debian:
    # the same suite on Debian itself, where distro/debian.env's names are
    # looked up. The privacy and ascii gates ran once, on linux.
    runs-on: ubuntu-latest
    container: debian:13@sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c   # a stable release: pinned, bump the digest with a point release
    timeout-minutes: 10
    steps:
      - run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git shellcheck diffutils jq >/dev/null   # jq: a desk reads the model's answer with it
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: every package name of distro/debian.env exists on Debian (nothing installed)
        run: apt-cache show $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p' distro/debian.env) >/dev/null
      - name: shellcheck
        run: shellcheck -S warning spark-shell tests/shell_test.sh
      - name: the suite in a throwaway HOME
        run: sh tests/shell_test.sh
  arch:
    # the same suite where the tools come from pacman
    runs-on: ubuntu-latest
    container: archlinux:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Arch there is, and -Syu moves it to today anyway
    timeout-minutes: 10
    steps:
      - run: pacman -Syu --noconfirm --needed git diffutils jq >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: every package name of distro/arch.env exists on Arch (nothing installed)
        run: pacman -Sp --needed $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p' distro/arch.env) >/dev/null
      - name: the suite in a throwaway HOME
        run: sh tests/shell_test.sh
  void:
    # the third family: xbps (glibc), the desktop's names too. xbps itself
    # first: a rolling distro refuses every install while xbps is behind.
    # libstdc++ is the runner's node (checkout)
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest   # zizmor: ignore[unpinned-images] a rolling distro: latest is the only Void there is, and -Su moves it to today anyway
    timeout-minutes: 10
    steps:
      - run: xbps-install -Syu xbps >/dev/null 2>&1 || true; xbps-install -Syu >/dev/null; xbps-install -Sy git bash diffutils jq gawk gzip libstdc++ >/dev/null
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: every package name of distro/void.env exists on Void (nothing installed)
        run: for p in $(sed -n 's/^PKG_SHELL=//p; s/^PKG_CLI=//p; s/^PKG_CONSOLE=//p; s/^PKG_DESKTOP=//p' distro/void.env); do xbps-query -R "$p" >/dev/null || { echo "no package $p"; exit 1; }; done
      - name: the suite in a throwaway HOME
        run: sh tests/shell_test.sh
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - name: the suite in a throwaway HOME (Apple's sh)
        run: sh tests/shell_test.sh
      - name: the Terminal.app helper, built and never applied
        run: SPARK_SHELL_NO_APPLY=1 /usr/bin/python3 tests/profile_test.py
