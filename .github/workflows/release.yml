# The release: a signed v* tag becomes a GitHub Release with the dialog
# binary, its sha256 and its SBOM. Nothing is published unless the tag is
# signed by a key in the tree's allowed-signers and names itself, ci.yml
# passed for its commit, and the binary built here has the sha256
# dialog/dialog.env pins in the tagged tree. The build is attested.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag object itself (checkout peels an annotated tag)
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: signed by a key in allowed-signers, and naming itself
        run: |
          set -eu
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=allowed-signers verify-tag "$GITHUB_REF_NAME"
          [ "$(git cat-file tag "$GITHUB_REF_NAME" | sed -n 's/^tag //p' | head -1)" = "$GITHUB_REF_NAME" ] || { echo "the tag object names another tag"; exit 1; }
      - name: ci.yml passed for the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success" --jq '.total_count')
          [ "$n" -gt 0 ] || { echo "no green ci.yml run for $sha"; exit 1; }
      - name: the toolchain dialog/rust-toolchain.toml pins
        working-directory: dialog
        run: rustup show active-toolchain || rustup toolchain install
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh tests/dialog_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^DIALOG_SHA256_X86_64_LINUX_MUSL=//p' dialog/dialog.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the binary is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp dialog/target/x86_64-unknown-linux-musl/release/spark-dialog out/spark-dialog-x86_64-linux-musl
          (cd out && sha256sum spark-dialog-x86_64-linux-musl > spark-dialog-x86_64-linux-musl.sha256)
          sh tests/dialog_sbom.sh > out/spark-dialog.cdx.json
          awk -v t="## ${GITHUB_REF_NAME}" '$0 == t { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > out/notes.md
          [ -s out/notes.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: release
          path: out/
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: out/spark-dialog-x86_64-linux-musl
      - name: the release, the CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "spark-shell $GITHUB_REF_NAME" --notes-file out/notes.md out/spark-dialog-x86_64-linux-musl out/spark-dialog-x86_64-linux-musl.sha256 out/spark-dialog.cdx.json
