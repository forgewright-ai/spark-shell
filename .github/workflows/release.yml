# The release: a signed v* tag becomes a GitHub Release with the dialog
# binary, its sha256 and its SBOM. Nothing is published unless the tag is
# on main, signed by a key the release before it trusted, names itself,
# and the chain of releases behind it holds (#64); ci.yml passed for its
# commit; and the binary built here has the sha256 dialog/dialog.env pins
# in the tagged tree. The build is attested.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag object itself (checkout peels an annotated tag)
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: signed by a key the release before it trusted, naming itself, the chain behind it whole
        # A tag never vouches for itself (#64): the keys are the previous
        # release's allowed-signers (the nearest v* tag behind this one, on
        # main), and the tag's own file only when no earlier release exists.
        # A rotation is a release signed by the old key that adds the new
        # one. Then the chain behind it, as spark's release.yml walks its
        # own: every release back verifies against the file of the release
        # before it, to the first whose predecessor carried one.
        run: |
          set -eu
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main || { echo "release: $GITHUB_REF_NAME is not on main"; exit 1; }
          keys="$RUNNER_TEMP/allowed-signers"
          if prev=$(git describe --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^{commit}^" 2>/dev/null); then
            git show "$prev:allowed-signers" > "$keys"; from="$prev's allowed-signers"
          else
            cp allowed-signers "$keys"; from="its own allowed-signers (no earlier release)"
          fi
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$keys" verify-tag "$GITHUB_REF_NAME" || { echo "release: $GITHUB_REF_NAME is not signed by a key in $from"; exit 1; }
          [ "$(git cat-file tag "$GITHUB_REF_NAME" | sed -n '/^$/q; s/^tag //p')" = "$GITHUB_REF_NAME" ] || { echo "the tag object names another tag"; exit 1; }
          t=${prev:-}
          while [ -n "$t" ] && p=$(git describe --abbrev=0 --match 'v[0-9]*' "$t^{commit}^" 2>/dev/null) && git cat-file -e "$p:allowed-signers" 2>/dev/null; do
            git show "$p:allowed-signers" > "$keys"
            git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$keys" verify-tag "$t" >/dev/null 2>&1 || { echo "release: $t, a release behind $GITHUB_REF_NAME, is not signed by a key in $p's allowed-signers: the chain is broken"; exit 1; }
            t=$p
          done
          echo "release: $GITHUB_REF_NAME signed by a key in $from; the chain behind it verified back to ${t:-$GITHUB_REF_NAME}"
      - name: ci.yml passed for the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success" --jq '.total_count')
          [ "$n" -gt 0 ] || { echo "no green ci.yml run for $sha"; exit 1; }
      - name: the toolchain dialog/rust-toolchain.toml pins
        working-directory: dialog
        run: rustup show active-toolchain || rustup toolchain install
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh tests/dialog_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^DIALOG_SHA256_X86_64_LINUX_MUSL=//p' dialog/dialog.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the binary is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp dialog/target/x86_64-unknown-linux-musl/release/spark-dialog out/spark-dialog-x86_64-linux-musl
          (cd out && sha256sum spark-dialog-x86_64-linux-musl > spark-dialog-x86_64-linux-musl.sha256)
          sh tests/dialog_sbom.sh > out/spark-dialog.cdx.json
          awk -v t="## ${GITHUB_REF_NAME}" '$0 == t { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > out/notes.md
          [ -s out/notes.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: out/spark-dialog-x86_64-linux-musl
      - name: the release, the CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "spark-shell $GITHUB_REF_NAME" --notes-file out/notes.md out/spark-dialog-x86_64-linux-musl out/spark-dialog-x86_64-linux-musl.sha256 out/spark-dialog.cdx.json
