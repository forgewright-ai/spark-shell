# The release: a signed v* tag becomes a GitHub Release with the dialog
# binary, its sha256 and its SBOM, and the wallpaper loop's binary and
# its sha256 (#187) and the pad's (v0.133), each built in the pinned image
# CI's wallpaper and pad jobs use. Nothing is published unless the tag is
# on main, signed by a key the release before it trusted, names itself,
# and the chain of releases behind it holds (#64); ci.yml passed for its
# commit; and the binary built here has the sha256 component/dialog/dialog.env pins
# in the tagged tree. The build is attested.
name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag object itself (checkout peels an annotated tag)
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: signed by a key the release before it trusted, naming itself, the chain behind it whole
        # A tag never vouches for itself: the keys are the previous release's
        # allowed-signers (the nearest v* tag behind this one, on main). A
        # rotation is a release signed by the old key that adds the new one.
        # Then the chain behind it: every release back verifies against the
        # file of the release before it, to the root, the first release of
        # the record, which verifies against its own tree once. The root's
        # name is here and not read from the history: a walk that stopped
        # wherever the file was missing could be stopped by the history it
        # checks. Only ssh signatures are read.
        run: |
          set -eu
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main || { echo "release: $GITHUB_REF_NAME is not on main"; exit 1; }
          keys="$RUNNER_TEMP/allowed-signers"; root=v0.135
          verify() { git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$keys" -c gpg.program=false -c gpg.openpgp.program=false -c gpg.x509.program=false verify-tag "$1"; }
          before() { git describe --abbrev=0 --match 'v[0-9]*' "$1^{commit}^" 2>/dev/null; }
          if [ "$GITHUB_REF_NAME" = "$root" ]; then
            prev=$root; git show "$root:allowed-signers" > "$keys"; from="its own allowed-signers, the root of the record"
          else
            prev=$(before "$GITHUB_REF_NAME") || { echo "release: no release behind $GITHUB_REF_NAME vouches for it"; exit 1; }
            git show "$prev:allowed-signers" > "$keys" 2>/dev/null || { echo "release: $prev has no allowed-signers"; exit 1; }
            from="$prev's allowed-signers"
          fi
          verify "$GITHUB_REF_NAME" || { echo "release: $GITHUB_REF_NAME is not signed by a key in $from"; exit 1; }
          [ "$(git cat-file tag "$GITHUB_REF_NAME" | sed -n '/^$/q; s/^tag //p')" = "$GITHUB_REF_NAME" ] || { echo "the tag object names another tag"; exit 1; }
          t=$prev
          while [ "$t" != "$root" ]; do
            p=$(before "$t") || { echo "release: the chain stops at $t, short of $root"; exit 1; }
            git show "$p:allowed-signers" > "$keys" 2>/dev/null || { echo "release: $p has no allowed-signers: the chain is broken"; exit 1; }
            verify "$t" >/dev/null 2>&1 || { echo "release: $t, a release behind $GITHUB_REF_NAME, is not signed by a key in $p's allowed-signers: the chain is broken"; exit 1; }
            t=$p
          done
          echo "release: $GITHUB_REF_NAME signed by a key in $from; the chain behind it verified back to $root"
      - name: ci.yml passed for the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success" --jq '.total_count')
          [ "$n" -gt 0 ] || { echo "no green ci.yml run for $sha"; exit 1; }
      - name: the toolchain component/dialog/rust-toolchain.toml pins
        working-directory: component/dialog
        run: rustup show active-toolchain || rustup toolchain install
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh test/dialog_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^DIALOG_SHA256_X86_64_LINUX_MUSL=//p' component/dialog/dialog.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the binary is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp component/dialog/target/x86_64-unknown-linux-musl/release/spark-dialog out/spark-dialog-x86_64-linux-musl
          (cd out && sha256sum spark-dialog-x86_64-linux-musl > spark-dialog-x86_64-linux-musl.sha256)
          sh test/dialog_sbom.sh > out/spark-dialog.cdx.json
          awk -v t="## ${GITHUB_REF_NAME}" '$0 == t { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > out/notes.md
          [ -s out/notes.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 7
  wallpaper:
    # the wallpaper loop at the tag, in the image CI's wallpaper job pins,
    # and the sha256 component/wallpaper/wallpaper.env pins in the tagged tree; the build
    # job above checked the tag before this one publishes anything
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:1.99.1-slim-bookworm@sha256:24707e70a4f1e23d9a7b25202ec43126d28a52294b96aad5c670df1fd1f1d400
    permissions:
      contents: read
    steps:
      - name: git, for the checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh test/wallpaper_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^WALLPAPER_SHA256_X86_64_LINUX_GNU=//p' component/wallpaper/wallpaper.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the wallpaper loop is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp component/wallpaper/target/x86_64-unknown-linux-gnu/release/spark-wallpaper out/spark-wallpaper-x86_64-linux-gnu
          (cd out && sha256sum spark-wallpaper-x86_64-linux-gnu > spark-wallpaper-x86_64-linux-gnu.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: wallpaper
          path: out/
          retention-days: 7
  winpad:
    # the pad at the tag, in the image CI's pad job pins, and the sha256
    # component/winpad/winpad.env pins in the tagged tree; the build job above checked the
    # tag before this one publishes anything
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:1.99.1-slim-bookworm@sha256:24707e70a4f1e23d9a7b25202ec43126d28a52294b96aad5c670df1fd1f1d400
    permissions:
      contents: read
    steps:
      - name: git, for the checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh test/winpad_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^WINPAD_SHA256_X86_64_LINUX_GNU=//p' component/winpad/winpad.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the pad is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp component/winpad/target/x86_64-unknown-linux-gnu/release/spark-winpad out/spark-winpad-x86_64-linux-gnu
          (cd out && sha256sum spark-winpad-x86_64-linux-gnu > spark-winpad-x86_64-linux-gnu.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: winpad
          path: out/
          retention-days: 7
  ear:
    # the ear at the tag, in the image CI's ear job pins, and the sha256
    # component/ear/ear.env pins in the tagged tree; the build job above checked the
    # tag before this one publishes anything
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:1.99.1-slim-bookworm@sha256:24707e70a4f1e23d9a7b25202ec43126d28a52294b96aad5c670df1fd1f1d400
    permissions:
      contents: read
    steps:
      - name: git, for the checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh test/ear_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^EAR_SHA256_X86_64_LINUX_GNU=//p' component/ear/ear.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the ear is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp component/ear/target/x86_64-unknown-linux-gnu/release/spark-ear out/spark-ear-x86_64-linux-gnu
          (cd out && sha256sum spark-ear-x86_64-linux-gnu > spark-ear-x86_64-linux-gnu.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: ear
          path: out/
          retention-days: 7
  bar:
    # the bar at the tag, in the image CI's bar job pins, and the sha256
    # component/bar/bar.env pins in the tagged tree; the build job above checked the
    # tag before this one publishes anything
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:1.99.1-slim-bookworm@sha256:24707e70a4f1e23d9a7b25202ec43126d28a52294b96aad5c670df1fd1f1d400
    permissions:
      contents: read
    steps:
      - name: git, for the checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: the build, and the sha256 the tagged tree pins
        run: |
          set -eu
          got=$(sh test/bar_build.sh | cut -d' ' -f1)
          want=$(sed -n 's/^BAR_SHA256_X86_64_LINUX_GNU=//p' component/bar/bar.env)
          echo "built $got, pinned $want"
          [ "$got" = "$want" ] || { echo "the bar is not the one the tree pins: nothing is published"; exit 1; }
          mkdir -p out
          cp component/bar/target/x86_64-unknown-linux-gnu/release/spark-bar out/spark-bar-x86_64-linux-gnu
          (cd out && sha256sum spark-bar-x86_64-linux-gnu > spark-bar-x86_64-linux-gnu.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: bar
          path: out/
          retention-days: 7
  publish:
    needs: [build, wallpaper, winpad, ear, bar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: wallpaper
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: winpad
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: ear
          path: out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: bar
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: |
            out/spark-dialog-x86_64-linux-musl
            out/spark-wallpaper-x86_64-linux-gnu
            out/spark-winpad-x86_64-linux-gnu
            out/spark-ear-x86_64-linux-gnu
            out/spark-bar-x86_64-linux-gnu
      - name: the release, the CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "spark-shell $GITHUB_REF_NAME" --notes-file out/notes.md out/spark-dialog-x86_64-linux-musl out/spark-dialog-x86_64-linux-musl.sha256 out/spark-dialog.cdx.json out/spark-wallpaper-x86_64-linux-gnu out/spark-wallpaper-x86_64-linux-gnu.sha256 out/spark-winpad-x86_64-linux-gnu out/spark-winpad-x86_64-linux-gnu.sha256 out/spark-ear-x86_64-linux-gnu out/spark-ear-x86_64-linux-gnu.sha256 out/spark-bar-x86_64-linux-gnu out/spark-bar-x86_64-linux-gnu.sha256
