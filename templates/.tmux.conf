# rendered by spark-shell from templates/.tmux.conf -- edit the template, then spark-shell on
# One plain look: ASCII and the 16 palette slots (colour0-15, default),
# no hex, no truecolor in anything of the look. The console palette
# `spark theme NAME` programs is what draws the slots; in an emulator the
# same file just looks plain. Content is not the look: what a program
# draws in a pane (a picture, text art) passes through in the colours it
# has, so under foot tmux is told foot can take RGB. On the console there
# is no RGB to take and nothing changes.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -sg escape-time 10
set -g history-limit 20000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse off
setw -g mode-keys vi
set -g focus-events on

# the status line: name on the left, `spark bar line` on the right, every
# 15 s -- SPARK_ASCII=1 because a #() has no client to ask what it draws on
set -g status on
set -g status-interval 15
set -g status-style "bg=default,fg=default"
set -g status-left " #[fg=colour@ACCENT_SLOT@,bold]@NAME@#[default] "
set -g status-left-length 30
set -g status-right "#(SPARK_ASCII=1 spark bar line)"
set -g status-right-length 140
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #[fg=colour@ACCENT_SLOT@,bold]#I #W#[default] "
setw -g window-status-current-style "fg=colour@ACCENT_SLOT@"
set -g pane-border-lines single
set -g pane-border-style "fg=colour@MUTED_SLOT@"
set -g pane-active-border-style "fg=colour@ACCENT_SLOT@"
set -g message-style "bg=default,fg=colour@ACCENT_SLOT@"

# keys: prefix stays C-b; splits that keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
