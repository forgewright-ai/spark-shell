# rendered by spark-shell from templates/etc/systemd/system/greetd.service.d/spark-shell.conf -- edit the template, then spark-shell on
# The login box draws after spark's console palette is set (the
# spark-console oneshot, setvtrgb), so its first frame is already in
# the palette. It is harmless when that unit is not there.
[Unit]
After=spark-console.service
