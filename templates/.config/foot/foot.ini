# rendered by spark-shell from templates/.config/foot/foot.ini -- edit the template, then spark-shell apply
# foot: the terminal window on the desktop (spark-shell desktop). This is
# the one render that names the palette's own hex: foot is the desktop's
# twin of the console palette, the surface that gives the sixteen slots
# their colours, so every other render can keep naming slots. Read at
# start only: after spark-shell apply, Super+Return opens a window in
# the new palette. The colour section is named for the foot installed:
# [colors] up to foot 1.25 (Debian 13 has 1.21), [colors-dark] from 1.26
# on (Arch) -- foot refuses a section it does not know, in the window.

[main]
font=@FONT@
pad=4x4 center
term=foot

[scrollback]
lines=20000

[bell]
urgent=no
notify=no
visual=no

[@FOOT_COLORS@]
background=@HEX_BG@
foreground=@HEX_FG@
regular0=@HEX_ANSI_0@
regular1=@HEX_ANSI_1@
regular2=@HEX_ANSI_2@
regular3=@HEX_ANSI_3@
regular4=@HEX_ANSI_4@
regular5=@HEX_ANSI_5@
regular6=@HEX_ANSI_6@
regular7=@HEX_ANSI_7@
bright0=@HEX_ANSI_8@
bright1=@HEX_ANSI_9@
bright2=@HEX_ANSI_10@
bright3=@HEX_ANSI_11@
bright4=@HEX_ANSI_12@
bright5=@HEX_ANSI_13@
bright6=@HEX_ANSI_14@
bright7=@HEX_ANSI_15@

