# rendered by spark-shell from templates/.config/foot/foot.ini -- edit the template, then spark-shell apply
# foot: the terminal window on the desktop (spark-shell desktop). This is
# the one render that names the palette's own hex: foot is the desktop's
# twin of the console palette, the surface that gives the sixteen slots
# their colours, so every other render can keep naming slots. Read at
# start only: after spark-shell apply, Super+Return opens a window in
# the new palette. The colours sit twice below: [colors] is what foot
# 1.21 (Debian 13) reads, [colors-dark] what foot 1.26 and newer (Arch)
# read; each foot takes the section it knows and logs the other to
# stderr, once, nothing shown in the window.

[main]
font=@FONT@
pad=8x8
term=foot

[scrollback]
lines=20000

[bell]
urgent=no
notify=no
visual=no

[colors]
background=@HEX_BG@
foreground=@HEX_FG@
regular0=@HEX_ANSI_0@
regular1=@HEX_ANSI_1@
regular2=@HEX_ANSI_2@
regular3=@HEX_ANSI_3@
regular4=@HEX_ANSI_4@
regular5=@HEX_ANSI_5@
regular6=@HEX_ANSI_6@
regular7=@HEX_ANSI_7@
bright0=@HEX_ANSI_8@
bright1=@HEX_ANSI_9@
bright2=@HEX_ANSI_10@
bright3=@HEX_ANSI_11@
bright4=@HEX_ANSI_12@
bright5=@HEX_ANSI_13@
bright6=@HEX_ANSI_14@
bright7=@HEX_ANSI_15@

[colors-dark]
background=@HEX_BG@
foreground=@HEX_FG@
regular0=@HEX_ANSI_0@
regular1=@HEX_ANSI_1@
regular2=@HEX_ANSI_2@
regular3=@HEX_ANSI_3@
regular4=@HEX_ANSI_4@
regular5=@HEX_ANSI_5@
regular6=@HEX_ANSI_6@
regular7=@HEX_ANSI_7@
bright0=@HEX_ANSI_8@
bright1=@HEX_ANSI_9@
bright2=@HEX_ANSI_10@
bright3=@HEX_ANSI_11@
bright4=@HEX_ANSI_12@
bright5=@HEX_ANSI_13@
bright6=@HEX_ANSI_14@
bright7=@HEX_ANSI_15@
