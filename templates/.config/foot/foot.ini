# rendered by spark-shell from templates/.config/foot/foot.ini -- edit the template, then spark-shell on
# foot: the terminal window on the desktop. This is the one file with
# the palette's hex colors. foot gives the 16 palette colors their
# values on the desktop, as the console does on its own, so every other
# file can name colors by number. foot reads this file when a window
# opens; a theme change sends the same colors to the windows already
# open, so they change in place. The color section is named for
# the foot installed: [colors] up to foot 1.25 (Debian 13 has 1.21),
# [colors-dark] from 1.26 on (Arch). foot refuses a section it does not
# know, in the window.

[main]
font=@FONT@
title=terminal
pad=4x4 center
term=foot

[scrollback]
lines=20000

[bell]
urgent=no
notify=no
visual=no

[@FOOT_COLORS@]
alpha=@FOOT_ALPHA@
background=@HEX_BG@
foreground=@HEX_FG@
regular0=@HEX_ANSI_0@
regular1=@HEX_ANSI_1@
regular2=@HEX_ANSI_2@
regular3=@HEX_ANSI_3@
regular4=@HEX_ANSI_4@
regular5=@HEX_ANSI_5@
regular6=@HEX_ANSI_6@
regular7=@HEX_ANSI_7@
bright0=@HEX_ANSI_8@
bright1=@HEX_ANSI_9@
bright2=@HEX_ANSI_10@
bright3=@HEX_ANSI_11@
bright4=@HEX_ANSI_12@
bright5=@HEX_ANSI_13@
bright6=@HEX_ANSI_14@
bright7=@HEX_ANSI_15@
# The five slots after the sixteen (#34): the accent, the muted color, the dialog's
# surface, its lit row and its quiet text. The prompt, spark's line and the dialog
# draw in them, so a theme change recolors them in place, text on screen too.
16=@HEX_ACCENT@
17=@HEX_MUTED@
18=@PANEL_BG@
19=@PANEL_HI@
20=@PANEL_MUTED@

