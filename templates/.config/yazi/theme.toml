# rendered by spark-shell from templates/.config/yazi/theme.toml -- edit the template, then spark-shell apply
# yazi's look, plain: no icon glyphs (they want a Nerd Font; the console
# and foot draw them as boxes), and the accent slot where yazi marks the
# current row. Everything else is yazi's own default theme.

[icon]
globs = []
dirs = []
files = []
exts = []
conds = []

[mgr]
cwd = { fg = "@ACCENT_STAR@" }
hovered = { reversed = true }
preview_hovered = { underline = true }
border_style = { fg = "@MUTED_STAR@" }
