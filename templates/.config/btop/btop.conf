#? rendered by spark-shell from templates/.config/btop/btop.conf
#? btop rewrites this file on exit, so it is a regular file and not a
#? symlink. Your changes inside btop stick, and spark-shell on offers to
#? back them up. One plain look: force_tty gives 16 colours through the
#? console palette, the TTY theme and tty graph symbols (no braille),
#? the same on the Linux console and in an emulator.
theme_background = False
truecolor = False
force_tty = True
graph_symbol = "tty"
vim_keys = True
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = False
show_battery = True
