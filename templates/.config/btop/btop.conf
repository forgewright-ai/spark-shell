#? rendered by spark-shell from templates/.config/btop/btop.conf
#? btop rewrites this file on exit, so it is a regular file and not a
#? symlink. Your changes inside btop stick, and spark-shell on saves
#? them as a .bak. force_tty gives the 16 palette colours, the TTY theme
#? and plain graph symbols (no braille), the same on the Linux console
#? and in a terminal app.
theme_background = False
truecolor = False
force_tty = True
graph_symbol = "tty"
vim_keys = True
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = False
show_battery = True
