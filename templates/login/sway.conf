# rendered by spark-shell from templates/login/sway.conf -- spark-shell off login removes it
# sway for the login screen: the wallpaper, and one window over all of it.
# The one tiled window, no border and no gaps, fills the screen; never
# fullscreen, where foot draws its background solid over the wallpaper.
output * bg @LOGIN_BG@
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
focus_follows_mouse no
seat * hide_cursor 2000
exec /@LOGIN_ETC@/window
