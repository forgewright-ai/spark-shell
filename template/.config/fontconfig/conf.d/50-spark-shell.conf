<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- rendered by spark-shell (spark-shell off desktop removes it). The bar
     draws its wifi bars in the family "spark-shell bars", which no font
     has, then in the bar's own face; this turns hinting off for that
     family alone, so the four bars end on one line, as foot draws them
     (#43). Nothing else asks for the family, so nothing else changes. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>spark-shell bars</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
