# rendered by spark-shell from templates/.config/foot/dialog.ini -- edit the template, then spark-shell on
# foot for home's window (Super+Space or a click on the bar):
# foot.ini, then the dialog's own size, air and ground, opaque. A file of
# its own, so a theme change or a new text size reaches the next dialog
# with no sway reload (#33).
[main]
include=@HOME@/.config/foot/foot.ini
title=spark
initial-window-size-chars=@PANEL_SIZE@
pad=@PANEL_PAD@
# Honor the compositor's usable area without cell-size rounding on a snap.
resize-by-cells=no

[@FOOT_COLORS@]
background=@PANEL_BG@
alpha=1.0

# the dialog's own window: spark-shell dialog draws its prompt the moment it maps (#138)
[environment]
SPARK_DIALOG_WINDOW=1
