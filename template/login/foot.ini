# rendered by spark-shell from templates/login/foot.ini -- spark-shell off login removes it
# foot for the login screen: the palette, and a clear background, so the
# wallpaper shows wherever the screen draws nothing of its own.

[main]
font=@FONT@
title=login
pad=0x0
term=foot

[bell]
urgent=no
notify=no
visual=no

[@FOOT_COLORS@]
alpha=0.0
background=@HEX_BG@
foreground=@HEX_FG@
regular0=@HEX_ANSI_0@
regular1=@HEX_ANSI_1@
regular2=@HEX_ANSI_2@
regular3=@HEX_ANSI_3@
regular4=@HEX_ANSI_4@
regular5=@HEX_ANSI_5@
regular6=@HEX_ANSI_6@
regular7=@HEX_ANSI_7@
bright0=@HEX_ANSI_8@
bright1=@HEX_ANSI_9@
bright2=@HEX_ANSI_10@
bright3=@HEX_ANSI_11@
bright4=@HEX_ANSI_12@
bright5=@HEX_ANSI_13@
bright6=@HEX_ANSI_14@
bright7=@HEX_ANSI_15@
