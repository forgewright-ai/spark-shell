# rendered by spark-shell from templates/login/sway.conf -- spark-shell off login removes it
# sway for the login screen: the wallpaper, and one window over all of it.
# The one tiled window, no border and no gaps, fills the screen; never
# fullscreen, where foot draws its background solid over the wallpaper.
output * bg @LOGIN_BG@
# your screens as the desktop has them (their place, orientation, mode,
# scale, on or off), rendered beside this file at spark-shell on login
include "/@LOGIN_ETC@/screens.conf"
default_border none
default_floating_border none
gaps inner 0
gaps outer 0
focus_follows_mouse no
seat * hide_cursor 2000
# the spark pointer, as the desktop has it (a copy under /usr/share/icons)
seat * xcursor_theme @POINTER_NAME@ @POINTER_SIZE@
# five minutes with no key pressed and no mouse moved turn the display off;
# any key or move turns it back on
exec swayidle timeout 300 'swaymsg "output * power off"' resume 'swaymsg "output * power on"'
exec /@LOGIN_ETC@/window
